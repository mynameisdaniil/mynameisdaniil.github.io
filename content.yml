  - id: facts
    title: Facts
    body: |
      Master's degree in radio engineering

      Full-time Linux user since Ubuntu 8.04

      Have experience writing nginx modules

      I have /dev/ops, which is a recursive link to myself

      Have experience writing Node.js native modules

      Do love the syntax of Erlang

      My other CAP is a theorem

      I do understand Riak's code

      I have lost my ability to explain monads

      Can't decide if I dislike Java more than C++ or vice versa

      Have written this line at 3:43 in the morning

      Wrote several Lisp interpreters

      I used Ansible back then, before it became mainstream

      Container pioneer (and I'm not talking about Docker)

      Cannot recommend any continuous integration server

      Have written this line (and all other lines) using Vim

      RPC? Ask me how

      Do hate DNS

      My first language was BASIC; my first program was written on a piece of paper and interpreted in my head

      Stock exchange? Ask me how

      Actually I don't have any cool facts about the Rust language. Guess this is a fact too
